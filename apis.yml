name: 10 Percent
description: 10 Percent is a two-sided agricultural marketplace with embedded financial services, a
  Speedinvest portfolio company (invested ~2020) operating in the agri-fintech and marketplaces space.
  Public sources describe it combining agricultural supply-chain e-commerce, grain procurement, and
  business-intelligence services with embedded financing such as factoring and credit offered inside
  transactions to help agricultural partners manage cash flow and access capital. It was surfaced as a
  Speedinvest portfolio company and added to the API Evangelist network as a stub; enrichment searched
  the public web and found no developer portal, documentation, or public API surface, so no API
  artifacts could be harvested. This profile remains an identity-only lead pending a discoverable API.
